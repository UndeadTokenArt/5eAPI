<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <rect width="40" height="40" fill="var(--tile-wall)"/>
  <!-- half corridor going east (only E is open) -->
  <line x1="20" y1="20" x2="40" y2="20" stroke="var(--tile-floor)" stroke-width="20" stroke-linecap="round"/>
  <!-- secret door hint on west dead-end wall -->
  <line x1="4" y1="13" x2="4" y2="27" stroke="var(--door-color)" stroke-width="8" stroke-dasharray="3,2" stroke-linecap="round"/>
</svg>
